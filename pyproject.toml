[project]
name = "pitcher"
version = "1.0.0"
description = "Football pitch availability for Jyväskylä, from the city's eTimmi booking system"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
