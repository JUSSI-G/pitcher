<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitcher — Jyväskylä pitch availability</title>
<meta name="description" content="Every football pitch in Jyväskylä on one sheet: free slots, live now-line, and a map.">
<meta name="theme-color" content="#f6f4ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pitcher">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="shell">
  <header class="masthead">
    <h1 class="wordmark">Pitcher<span class="dot">.</span></h1>
    <div class="mast-meta">
      <span>Football pitches in Jyväskylä</span>
      <span class="updated" id="updatedAt"></span>
    </div>
  </header>

  <nav class="main-tabs" aria-label="Views">
    <button class="main-tab active" onclick="switchTab('week', this)">Weekly</button>
    <button class="main-tab" onclick="switchTab('find', this)">Find a slot</button>
    <button class="main-tab" onclick="switchTab('map', this)">Map</button>
  </nav>

  <div id="weekNav" class="week-nav" style="display:none;"></div>
  <main>
    <div id="weekView">
      <div class="skeleton" aria-busy="true" aria-label="Loading bookings">
        <div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>
        <div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>
      </div>
    </div>

    <div id="findView" style="display:none;">
      <div class="find-panel">
        <button class="btn-now" onclick="searchNow()">
          Free right now
        </button>
        <div class="divider">or pick a time</div>
        <div class="find-form">
          <div>
            <div class="field-label">Day</div>
            <div class="pick-days" id="pickDays"></div>
          </div>
          <div>
            <div class="field-label">Time</div>
            <div class="time-row">
              <input type="range" id="timeSlider" min="6" max="22" step="0.25" value="15"
                oninput="onSlider(this)" aria-label="Kick-off time">
              <div class="time-display" id="timeDisplay">15:00</div>
            </div>
          </div>
          <div>
            <div class="field-label">Distance</div>
            <div class="loc-row">
              <button class="btn-loc" id="locBtn" onclick="toggleLocation()">
                Use my location
              </button>
              <span class="loc-status" id="locStatus"></span>
            </div>
          </div>
          <button class="btn-search" onclick="runSearch()">
            Show free pitches
          </button>
        </div>
        <div class="results" id="results" style="display:none;">
          <div class="search-bar">
            <div class="search-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.3" y2="16.3"/></svg>
              <input class="search-input" type="text" id="findSearchInput"
                placeholder="Filter by pitch or area…" aria-label="Filter results"
                oninput="findSearch = this.value.toLowerCase(); runSearch()">
            </div>
          </div>
          <div id="resultsBody"></div>
        </div>
      </div>
    </div>

    <div id="mapView" style="display:none;">
      <div class="day-tabs" id="mapDayTabs"></div>
      <div class="legend">
        <span><i class="sw sw-free"></i>Free now</span>
        <span><i class="sw sw-later"></i>Free later</span>
        <span><i class="sw sw-full"></i>Fully booked</span>
        <span><i class="sw sw-none"></i>No schedule</span>
      </div>
      <div class="map-wrap"><div id="map"></div></div>
      
    </div>
  </main>

  <footer>
    <span>Data: City of Jyväskylä eTimmi</span>
    <span>Map © OpenStreetMap, Esri</span>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/static/app.js"></script>
</body>
</html>
